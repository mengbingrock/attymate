  projects: [firm-onboarding]
agents:
  legal-ops-supervisor:
    permissions:
      canCreateAgents: true
    adapter:
      type: codex_local
      config:
        model: "gpt-5.5"
        timeoutSec: 1200
        graceSec: 20
        extraArgs:
          - "--skip-git-repo-check"
    inputs:
      env:
        AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:
          kind: plain
          requirement: optional
          portability: system_dependent
          description: Azure Document Intelligence endpoint URL used by the docling three-stage PDF pipeline (run-azure stage). Provided by the server deployment environment; no per-agent action needed.
        AZURE_DOCUMENT_INTELLIGENCE_KEY:
          kind: secret
          requirement: optional
          portability: system_dependent
          description: Azure Document Intelligence API key used by the docling three-stage PDF pipeline (run-azure stage). Provided by the server deployment environment; no per-agent action needed.
