      config:
        model: "gpt-5.5"
        timeoutSec: 1200
        graceSec: 20
        extraArgs:
          - "--skip-git-repo-check"
  source-intake-agent:
    adapter:
      type: codex_local
      config:
        model: "gpt-5.5"
        timeoutSec: 1200
        graceSec: 20
        extraArgs:
