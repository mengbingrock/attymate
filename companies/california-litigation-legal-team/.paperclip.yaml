inputs:
  deployment:
    workspace_root:
      kind: path
      requirement: required
      description: Absolute workspace root to configure as each codex_local agent cwd after import. Use the active AttyMate WORKSPACE selection as the source of truth and revalidate it before runner jobs.
    codex_auth:
      kind: text
      requirement: optional
      default: "Use the current authenticated Codex session; no extra auth setup is required for sandbox_autopilot local testing."
      description: Configure authenticated Codex CLI access or an approved API-key based auth mechanism in the target deployment.
    python_command:
      kind: text
      requirement: optional
      default: "python3"
      description: Python command or environment launcher agents may use for local scripts and PDF/OCR tooling.
    pdf_ocr_runtime:
      kind: text
      requirement: optional
      default: "Optional local OCR/PDF tooling; disabled for sandbox runs unless already available in the workspace."
      description: Deployment-approved OCR/PDF runtime, such as Docling or another local processing tool, configured outside the public package.
    firm_operations_guide:
      kind: text
      requirement: optional
      default: "Use the imported onboarding guide or issue-scoped instructions until a private Firm Operations Guide is configured."
      description: Private Paperclip issue-document reference for the deployment's durable Firm Operations Guide.
    browser_tooling:
      kind: text
      requirement: optional
      default: "Disabled for authenticated or side-effectful browser actions; public read-only browsing may be issue-scoped."
      description: Browser automation tool status and approval policy for BrowserOS or an equivalent deployment-approved browser.
    gmail_connector:
      kind: text
      requirement: optional
      description: Gmail connector status. Sensitive values must use Paperclip secret references, not inline package data.
    gmail_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only Gmail monitoring scope, query rules, dedupe policy, routing criteria, redaction policy, and schedule preference. Required before enabling Gmail Monitor Agent routines.
    google_calendar_connector:
      kind: text
      requirement: optional
      description: Google Calendar connector status. Calendar writes require issue-level approval.
    calendar_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only Calendar monitoring scope, calendar set, exclusions, lookback/lookahead windows, deadline/event categories, dedupe policy, redaction policy, routing criteria, and schedule preference. Required before enabling Calendar Agent monitor routines.
    google_drive_connector:
      kind: text
      requirement: optional
      description: Google Drive connector status. Downloads, uploads, and sharing require issue-level approval.
    lexis_access:
      kind: text
      requirement: optional
      description: Lexis or legal research access status. External research and new authorities require issue-level approval.
    lasc_access:
      kind: text
      requirement: optional
      description: LASC docket access status. Authentication, paid retrieval, downloads, filing, and service require approval.
    docket_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only public docket monitoring scope, authorized courts or portals, case-list source, check cadence, change-detection rule, report cadence, and red gates. Required before enabling Docket Agent monitor routines.
    monitoring_report_policy:
      kind: text
      requirement: optional
      description: Deployment policy for monitor reports to Legal Ops Supervisor, including redaction, dedupe, candidate issue creation, routine status, and review cadence.
    matter_status_style:
      kind: text
      requirement: optional
      description: Deployment preference for lawyer-facing Matter Status Digest tone, detail level, and preferred next-action phrasing.
    matter_root:
      kind: path
      requirement: runtime
      description: Supplied per issue through the Matter Safety Contract, not stored in the reusable package.
    output_root:
      kind: path
      requirement: runtime
      description: Supplied per issue through the Matter Safety Contract, not stored in the reusable package.
routines:
  run-gmail-monitor:
    status: "paused"
    priority: "medium"
    concurrencyPolicy: "coalesce_if_active"
    catchUpPolicy: "skip_missed"
    triggers:
      - kind: schedule
        cronExpression: "0 8-18 * * 1-5"
        timezone: "America/Los_Angeles"
  run-calendar-monitor:
    status: "paused"
    priority: "medium"
    concurrencyPolicy: "coalesce_if_active"
    catchUpPolicy: "skip_missed"
    triggers:
      - kind: schedule
        cronExpression: "0 8 * * 1-5"
        timezone: "America/Los_Angeles"
  run-docket-monitor:
    status: "paused"
    priority: "medium"
    concurrencyPolicy: "coalesce_if_active"
    catchUpPolicy: "skip_missed"
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1"
        timezone: "America/Los_Angeles"
