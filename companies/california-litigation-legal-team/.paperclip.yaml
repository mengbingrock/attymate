        extraArgs:
          - "--skip-git-repo-check"
  drafting-assembly-agent:
    adapter:
      type: codex_local
      config:
        model: "gpt-5.5"
        timeoutSec: 1800
        graceSec: 20
        extraArgs:
          - "--skip-git-repo-check"
  legal-qa-agent:
    adapter:
      type: codex_local
      config:
        model: "gpt-5.5"
        timeoutSec: 1200
