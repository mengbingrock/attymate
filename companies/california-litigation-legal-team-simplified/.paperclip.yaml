inputs:
  deployment:
    workspace_root:
      kind: path
      requirement: required
      description: Absolute workspace root to configure as each codex_local agent cwd after import.
    codex_auth:
      kind: text
      requirement: required
      description: Configure authenticated Codex CLI access or an approved API-key based auth mechanism in the target deployment.
    python_command:
      kind: text
      requirement: required
      description: Python command or environment launcher agents may use for local scripts and PDF/OCR tooling.
    pdf_ocr_runtime:
      kind: text
      requirement: required
      description: Deployment-approved OCR/PDF runtime, such as Docling or another local processing tool, configured outside the public package.
    firm_operations_guide:
      kind: text
      requirement: required
      description: Private Paperclip issue-document reference for the deployment's durable Firm Operations Guide.
    browser_tooling:
      kind: text
      requirement: required
      description: Browser automation tool status for BrowserOS or an equivalent deployment-approved browser.
    gmail_connector:
      kind: text
      requirement: optional
      description: Gmail connector status. Sensitive values must use Paperclip secret references, not inline package data.
    gmail_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only Gmail monitoring scope, query rules, dedupe policy, routing criteria, redaction policy, and schedule preference. Required before enabling Gmail Monitor Agent routines.
    google_calendar_connector:
      kind: text
      requirement: optional
      description: Google Calendar connector status. The Calendar Agent writes entries as the workflow requires.
    calendar_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only Calendar monitoring scope, calendar set, exclusions, lookback/lookahead windows, deadline/event categories, dedupe policy, redaction policy, routing criteria, and schedule preference. Required before enabling Calendar Agent monitor routines.
    google_drive_connector:
      kind: text
      requirement: optional
      description: Google Drive connector status. Downloads, uploads, and sharing run as the workflow requires.
    lexis_access:
      kind: text
      requirement: optional
      description: Lexis or legal research access status. The Legal Research Agent runs external research and adds new authorities as the workflow requires.
    lasc_access:
      kind: text
      requirement: optional
      description: LASC docket access status. The Docket Agent reads the public record; paid retrieval, downloads, filing, and service stay out of its lane.
    docket_monitor_profile:
      kind: text
      requirement: optional
      description: Read-only public docket monitoring scope, authorized courts or portals, case-list source, check cadence, change-detection rule, and report cadence. Required before enabling Docket Agent monitor routines.
    monitoring_report_policy:
      kind: text
      requirement: optional
      description: Deployment policy for monitor reports to Legal Ops Supervisor, including redaction, dedupe, candidate issue creation, routine status, and review cadence.
    matter_status_style:
      kind: text
      requirement: optional
      description: Deployment preference for lawyer-facing Matter Status Digest tone, detail level, and preferred next-action phrasing.
    matter_root:
      kind: path
      requirement: runtime
      description: Supplied per issue through the Matter Safety Contract, not stored in the reusable package.
    output_root:
      kind: path
      requirement: runtime
      description: Supplied per issue through the Matter Safety Contract, not stored in the reusable package.
