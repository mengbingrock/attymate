schema: paperclip/v1
sidebar:
  agents: [legal-ops-supervisor, source-intake-agent, facts-evidence-agent, legal-research-agent, drafting-assembly-agent, legal-qa-agent, calendar-agent, docket-agent, practice-learning-agent, gmail-monitor-agent]
  projects: [firm-onboarding]
agents:
  legal-ops-supervisor:
    permissions:
      canCreateAgents: true
    adapter:
      type: codex_local
      config:
        model: "gpt-5.5"
        timeoutSec: 1200
        graceSec: 20
        extraArgs:
          - "--skip-git-repo-check"
    inputs:
      env:
        AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:
          kind: plain
          requirement: optional
          portability: system_dependent
          description: Azure Document Intelligence endpoint URL used by the docling three-stage PDF pipeline (run-azure stage). Deployment-specific; fill in per environment.
        AZURE_DOCUMENT_INTELLIGENCE_KEY:
          kind: secret
          requirement: optional
          portability: system_dependent
          description: Azure Document Intelligence API key used by the docling three-stage PDF pipeline (run-azure stage). Store as a Paperclip secret; fill in per environment.
  source-intake-agent:
