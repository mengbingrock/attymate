[package]
name = "attymate"
version = "0.1.0"
description = "AttyMate desktop client — native shell around the Paperclip UI"
authors = ["AttyMate"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "attymate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
